  <meta property="og:type" content="website">

  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">

<body class="index-body" id="top">

  <a class="skip-link" href="#main">Yazılara geç</a>

  <div class="page-glow" aria-hidden="true"></div>

  <svg class="icon-sprite" aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg">
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="10.8" cy="10.8" r="6.6"/><path d="m15.8 15.8 4.7 4.7"/></symbol>
    <symbol id="i-arrow-up-right" viewBox="0 0 24 24"><path d="M7 17 17 7M8 7h9v9"/></symbol>
  </svg>

  <header class="site-header">
    <div class="header-inner">
      <a class="brand" href="./"><span class="brand-text">notlar</span><span class="brand-dot" aria-hidden="true"></span></a>
    </div>
  </header>

  <main class="index-main" id="main">
    <h1 class="sr-only">Notlar</h1>

    <section class="archive" id="yazilar" aria-label="Yazılar">
      <div class="archive-card">
        <div class="archive-toolbar">
          <div class="year-tabs" id="year-tabs" role="group" aria-label="Yıla göre filtrele"></div>

          <label class="archive-search">
            <svg aria-hidden="true"><use href="#i-search"></use></svg>
            <span class="sr-only">Yazılarda ara</span>
            <input id="search-input" type="search" placeholder="Ara" autocomplete="off" spellcheck="false">
          </label>
        </div>

        <ol class="post-list" id="post-list" aria-live="polite" aria-busy="true">
          <li class="list-loading">Yükleniyor…</li>
        </ol>

        <div class="empty-state" id="empty-state" hidden>
          <p>Henüz yazı yok.</p>
        </div>
      </div>
    </section>
  </main>

  <noscript>
    <div class="noscript">Yazıları görmek için JavaScript'e ihtiyaç var.</div>
  </noscript>

</body>
</html>
