<body class="book-body" id="top">

  <a class="skip-link" href="#kitap">Kitaba geç</a>

  <div class="scene-grain" aria-hidden="true"></div>
  <div class="scene-light" aria-hidden="true"></div>

  <main class="book-scene" id="kitap">
    <div class="book-loader" id="book-loader" role="status" aria-label="Kitap açılıyor">
      <span class="loader-mark" aria-hidden="true">n<span>.</span></span>
    </div>

    <div class="book-area" id="book-area" hidden>
      <div class="book-stage">
        <div class="book-shadow" aria-hidden="true"></div>
        <div class="book" id="book" role="group" tabindex="0" aria-roledescription="kitap" aria-label="Notlar kitabı">
          <div class="book-cover" aria-hidden="true"></div>
          <div class="book-block book-block--left" aria-hidden="true"></div>
          <div class="book-block book-block--right" aria-hidden="true"></div>
          <div class="book-block book-block--bottom" aria-hidden="true"></div>
          <div class="book-base">
            <div class="base-slot" id="base-left"></div>
            <div class="base-slot" id="base-right"></div>
          </div>
          <div class="book-leaves" id="book-leaves"></div>
          <div class="book-spine" aria-hidden="true"></div>
          <div class="book-ribbon" aria-hidden="true"></div>
          <div class="book-turn-shadow" aria-hidden="true"></div>
        </div>

        <div class="single-book" id="single-book" role="group" tabindex="0" aria-roledescription="kitap" aria-label="Notlar kitabı" hidden>
          <div class="single-spine" aria-hidden="true"></div>
          <div class="single-block single-block--right" aria-hidden="true"></div>
          <div class="single-block single-block--bottom" aria-hidden="true"></div>
          <div class="single-base" id="single-base"></div>
          <div class="single-flip" id="single-flip" aria-hidden="true"></div>
          <div class="single-ribbon" aria-hidden="true"></div>
          <div class="single-shadow-cast" aria-hidden="true"></div>
        </div>
      </div>
    </div>

    <div class="book-error" id="book-error" hidden>
      <p class="eyebrow">Defter açılamadı</p>
      <p>Yazılar şu an yüklenemedi. Bağlantını kontrol edip yeniden dene.</p>
      <button class="text-link" type="button" id="retry-load">Yeniden dene</button>
    </div>
  </main>

  <nav class="sr-only" id="flat-index" aria-label="Tüm yazılar"></nav>

  <noscript>
    <div class="noscript">Kitabı okuyabilmek için JavaScript'e ihtiyaç var.</div>
  </noscript>

</body>
